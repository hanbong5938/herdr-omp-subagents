id = "omp-subagents"
name = "OMP Subagent Models"
version = "0.3.1"
min_herdr_version = "0.8.0"
platforms = ["macos", "linux"]
description = "Show the current main OMP model and running subagent models in Herdr's agents sidebar"

[[actions]]
id = "install-bridge"
title = "Install OMP model bridge"
contexts = ["workspace"]
command = ["sh", "scripts/plugin.sh", "install"]

[[actions]]
id = "doctor"
title = "Diagnose OMP model bridge"
contexts = ["workspace"]
command = ["sh", "scripts/plugin.sh", "doctor"]
