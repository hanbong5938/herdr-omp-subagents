id = "omp-subagents"
name = "OMP Subagent Models"
version = "0.2.0"
min_herdr_version = "0.8.0"
platforms = ["macos", "linux"]
description = "Display live OMP subagent models in the native agents sidebar"

[[actions]]
id = "install-bridge"
title = "Install OMP model bridge"
contexts = ["workspace"]
command = ["sh", "scripts/plugin.sh", "install"]

[[actions]]
id = "doctor"
title = "Diagnose OMP model bridge"
contexts = ["workspace"]
command = ["sh", "scripts/plugin.sh", "doctor"]
